<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      GitHub Pages serves this project statically, so a real path like /view/events
      returns a 404 from GitHub's server before our JS router ever runs. 404.html
      redirects those requests back here encoded in a query string; this script
      (must run before anything else) decodes that and restores the real URL via
      pushState, so script.js's router sees the correct path on first load.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      try {
        (function (l) {
          if (l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function (s) {
              return s.replace(/~and~/g, '&');
            }).join('?');
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          }
        }(window.location));
      } catch (e) {
        // replaceState can be blocked in sandboxed/embedded preview contexts
        // (e.g. file:// or a restricted iframe) -- harmless to skip there.
      }
    </script>
    <title>Notre Dame College Mymensingh Math Club</title>
    <meta name="description" content="Official website for the Math Club of Notre Dame College Mymensingh. Explore events, articles, and resources.">
    <meta name="google-site-verification" content="V6PLMn14GyCjP4wY4CkAMwUosjCWYkOXR7_x7c-b4qE" />
    <link rel="icon" type="image/x-icon" href="assets/logo/logo.ico">
    <link rel="canonical" href="https://ndcmmathclub.github.io/view/" />
    <!-- The logo is the very first thing rendered (loading screen) and appears
         again in the header on every page, so it's preloaded here rather than
         discovered only once script.js starts building the DOM. -->
    <link rel="preload" as="image" href="assets/logo/logo.png" fetchpriority="high">
    <!-- Warm up the network connection for the current event's photo(s) as early as
         possible, so the Events page's "View" lightbox never has to wait on a cold fetch. -->
    <link rel="preload" as="image" href="assets/activities/Announcement_NDCMC_IMO2026.png">
    <meta property="og:title" content="Math Club - Notre Dame College Mymensingh" />
    <meta property="og:description" content="Official website for the Math Club of Notre Dame College Mymensingh. Explore events, articles, and resources." />
    <meta property="og:image" content="https://ndcmmathclub.github.io/view/assets/logo.jpg" />
    <meta property="og:url" content="https://ndcmmathclub.github.io/view/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image">

      }
    }
    </script>

</html>
